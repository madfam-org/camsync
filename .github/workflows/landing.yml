name: Landing

# The landing at camsync.madfam.io (one service: camsync-landing). The studio is never built or
# deployed: it runs on a Mac on a local network.
#
# Caller for Enclii's shared reusable workflow: buildx, push to GHCR as :${SHA}, keyless cosign sign
# and verify, then the kustomize digest pin committed to main, which the GitOps sync picks up.
#
# Image name is the contract: image_prefix ghcr.io/madfam-org plus the service name gives
# ghcr.io/madfam-org/camsync-landing, the exact `images:` entry in
# infra/k8s/production/kustomization.yaml.
#
# The ref is a full commit SHA on enclii `main`. Bumping it is a deliberate change: confirm the SHA is
# on main, read the diff of .github/workflows/build-publish.yml between the two SHAs, re-check the
# inputs and named secrets below against its `on.workflow_call`, then change the SHA and its comment
# together.
#
# DISPATCH ONLY: a merge never builds or deploys by itself (docs/DEPLOYMENT.md).
on:
  workflow_dispatch:
    inputs:
      # Named so the reusable workflow builds the service on every dispatch, whatever main's last
      # commit touched; without it a dispatch could build nothing and still end green.
      services:
        description: Comma-separated services to build
        required: false
        default: camsync-landing

concurrency:
  group: landing-production-kustomization
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (landing tests)
    # Releases are cut from main only: a dispatch from any other ref builds nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Landing server and deployment contract
        run: node --test site/server/test/*.test.mjs

  build-publish:
    needs: preflight
    uses: madfam-org/enclii/.github/workflows/build-publish.yml@5713e0b381651f9df1ec055f43a833053eaf0f10 # enclii main 2026-11-16
    with:
      image_prefix: ghcr.io/madfam-org
      kustomization_path: infra/k8s/production
      # `paths` mirror the Dockerfile's COPY sources (site/server/test keeps them in lockstep).
      services: |
        [
          {"name":"camsync-landing", "dockerfile":"site/Dockerfile", "paths":"site/Dockerfile site/Dockerfile.dockerignore site/server site/web", "build_args":"CAMSYNC_REVISION=${{ github.sha }}", "implicit_dockerfile_dir": false}
        ]
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      ENCLII_CALLBACK_TOKEN: ${{ secrets.ENCLII_CALLBACK_TOKEN }}
    permissions:
      contents: write
      packages: write
      id-token: write
