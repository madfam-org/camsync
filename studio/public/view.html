<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phonecam viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; background: transparent; }
  #note { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          font: 14px/1.4 -apple-system, system-ui, sans-serif; color: #9aa; text-align: center; padding: 16px; }
  body.live #note { display: none; }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="note">Waiting for the phone…</div>
<script type="module">
import { makeSignal, waitForIce } from '/shared.js';

const params = new URLSearchParams(location.search);
const video = document.getElementById('video');
const note = document.getElementById('note');
const signal = makeSignal({ role: 'viewer', name: params.get('name') || 'viewer' });
video.muted = params.get('muted') === '1';
// Transparent by default so a viewer embedded in another program shows only the picture; the control panel asks for black.
if (/^[0-9a-f]{3,6}$/i.test(params.get('bg') || '')) document.documentElement.style.background = `#${params.get('bg')}`;

let pc = null;
let lastHello = 0;
let playError = '';

// An ordinary browser tab refuses to autoplay with sound, so there the picture falls back to muted.
// Only that specific refusal mutes it: any other play() failure (such as one play() call being
// interrupted by the next) must not silence a source that is allowed to play sound.
function startPlayback() {
  video.play().then(() => { playError = ''; }).catch((e) => {
    playError = e.name;
    if (e.name === 'NotAllowedError' && !video.muted) {
      video.muted = true;
      video.play().catch(() => {});
    }
  });
}

function hello() {
  lastHello = Date.now();
  signal.send('phone', 'hello').catch(() => {});
}

function isLive() {
  return pc && (pc.connectionState === 'connected' || pc.connectionState === 'connecting');
}

async function onOffer(msg) {
  if (pc) pc.close();
  const peer = new RTCPeerConnection();
  pc = peer;
  peer.ontrack = (e) => {
    if (video.srcObject !== e.streams[0]) video.srcObject = e.streams[0];
    startPlayback();
  };
  peer.onconnectionstatechange = () => {
    if (pc !== peer) return;
    document.body.classList.toggle('live', peer.connectionState === 'connected');
    note.textContent = peer.connectionState === 'connected' ? '' : `Connection: ${peer.connectionState}`;
  };
  await peer.setRemoteDescription({ type: 'offer', sdp: msg.data.sdp });
  await peer.setLocalDescription(await peer.createAnswer());
  await waitForIce(peer);
  await signal.send(msg.from, 'answer', { sdp: peer.localDescription.sdp });
}

signal.listen(async (msg) => {
  if (msg.type === 'offer') await onOffer(msg);
  if (msg.type === 'phone-ready') hello();
});

// Report what this viewer is actually receiving, so sound and picture can be checked from the Mac.
async function report() {
  const body = {
    name: params.get('name') || 'viewer', state: pc ? pc.connectionState : 'none',
    muted: video.muted, paused: video.paused, volume: video.volume, playError,
    width: video.videoWidth, height: video.videoHeight,
    audioTracks: video.srcObject ? video.srcObject.getAudioTracks().map((t) => ({ enabled: t.enabled, muted: t.muted, state: t.readyState })) : [],
  };
  if (pc) {
    (await pc.getStats()).forEach((s) => {
      if (s.type !== 'inbound-rtp') return;
      if (s.kind === 'audio') body.audio = { packets: s.packetsReceived, bytes: s.bytesReceived, level: s.audioLevel, energy: s.totalAudioEnergy };
      if (s.kind === 'video') body.video = { fps: s.framesPerSecond, decoder: s.decoderImplementation, dropped: s.framesDropped };
    });
  }
  await fetch(signal.api('viewer-status', `&id=${signal.id}`), {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
  });
}
setInterval(() => report().catch(() => {}), 2000);

// Ask the phone for a stream now, and again whenever there is no live connection.
hello();
setInterval(() => {
  if (!isLive() && Date.now() - lastHello > 4000) hello();
}, 1000);
</script>
</body>
</html>
