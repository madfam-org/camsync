# The camsync landing: one Deployment, one host. Stateless: no secrets, no database, no
# outbound calls. Service links are switched off so Kubernetes injects no variables for the Services
# in the namespace; the server reads only the CAMSYNC_* variables set here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camsync-landing
  labels:
    app.kubernetes.io/name: camsync-landing
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: madfam-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: camsync-landing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: camsync-landing
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: madfam-platform
        app: camsync-landing
        enclii.dev/service: camsync-landing
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: camsync-landing
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: landing
          image: ghcr.io/madfam-org/camsync-landing:latest
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9090
          env:
            - name: CAMSYNC_ENV
              value: production
            - name: CAMSYNC_PUBLIC_HOSTS
              value: obs.madfam.io
            - name: CAMSYNC_PORT
              value: '8000'
            - name: CAMSYNC_METRICS_PORT
              value: '9090'
          # A short pause before the listener closes, so the endpoint is out of rotation first.
          lifecycle:
            preStop:
              exec:
                command: ['sleep', '5']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
