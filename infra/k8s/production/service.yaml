# The Service the tunnel route dials (the enclii.yaml domain pins port 80). /metrics is not on it.
apiVersion: v1
kind: Service
metadata:
  name: camsync-landing
  labels:
    app: camsync-landing
    app.kubernetes.io/name: camsync-landing
    app.kubernetes.io/part-of: madfam-platform
spec:
  selector:
    app.kubernetes.io/name: camsync-landing
  ports:
    - name: http
      port: 80
      targetPort: http
