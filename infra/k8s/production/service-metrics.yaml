# Internal metrics Service for the scraper; never named by a tunnel route.
apiVersion: v1
kind: Service
metadata:
  name: camsync-landing-metrics
  labels:
    app.kubernetes.io/name: camsync-landing
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: madfam-platform
spec:
  selector:
    app.kubernetes.io/name: camsync-landing
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
