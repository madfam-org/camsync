# Production kustomize base for the camsync landing (Enclii project camsync,
# namespace camsync). Image digest: pinned by the Landing workflow (Enclii's reusable
# build-publish), which commits the digest here. The all-zero digest is a PLACEHOLDER the first
# successful build overwrites; it never resolves, so nothing can run an unpinned image before then.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: camsync
resources:
- deployment.yaml
- service.yaml
- service-metrics.yaml
- poddisruptionbudget.yaml
- network-policy.yaml
images:
- digest: sha256:c5de485378015ac26e8e62bcdcc182c80d933286ac1425dc00e88fe28547f067
  name: ghcr.io/madfam-org/camsync-landing
  newName: ghcr.io/madfam-org/camsync-landing
